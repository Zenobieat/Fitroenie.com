<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Player</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .view { display: none; padding: 20px; }
    .view.active { display: block; }
    .player-body { background: #46178f; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; text-align: center; }
    input { display: block; width: 80%; padding: 15px; margin: 10px auto; font-size: 1.2rem; border-radius: 4px; border: none; }
    .btn-join { width: 80%; padding: 15px; background: #333; color: #fff; font-size: 1.2rem; border: none; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; height: 80vh; gap: 10px; }
    .btn-opt { font-size: 3rem; border: none; border-radius: 8px; color: #fff; }
    .red { background-color: #e21b3c; }
    .blue { background-color: #1368ce; }
    .orange { background-color: #d89e00; }
    .green { background-color: #26890c; }
    .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; border-top-color: #1368ce; animation: spin 0.9s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body class="player-body">
  <div id="screen-login" class="view active">
    <h1>Fitroenie Quiz</h1>
    <input type="text" id="nickname" placeholder="Jouw Naam" maxlength="12" />
    <input type="number" id="pin" placeholder="Game Code" />
    <button onclick="joinGame()" class="btn-join">DEELNEMEN</button>
    <p id="error-msg" style="color:#ff4d4d;font-weight:bold;"></p>
    <div class="status-bar" id="connection-status">Verbinden met server...</div>
    <p style="font-size:12px;margin-top:20px;cursor:pointer;" onclick="toggleDebug()">Hulp nodig? Klik hier.</p>
    <div id="debug-log" style="margin-top:10px;font-size:12px;color:#aaa;background:rgba(0,0,0,0.2);padding:10px;text-align:left;max-height:100px;overflow-y:auto;display:none">Log:<br></div>
  </div>
  <div id="screen-wait" class="view">
    <h1>Je zit erin!</h1>
    <h2 id="display-name">...</h2>
    <div style="font-size:50px;">⏳</div>
    <p>Wacht tot de host start...</p>
  </div>
  <div id="screen-game" class="view">
    <div class="grid">
      <button class="btn-opt red" onclick="sendAnswer('A')">▲</button>
      <button class="btn-opt blue" onclick="sendAnswer('B')">◆</button>
      <button class="btn-opt orange" onclick="sendAnswer('C')">●</button>
      <button class="btn-opt green" onclick="sendAnswer('D')">■</button>
    </div>
  </div>
  <script>
    const socket = io({ transports: ['websocket', 'polling'] })
    let myPin = null
    const deviceId = (localStorage.getItem('fitroenie_device_id') || (() => {
      const id = Math.random().toString(36).slice(2)
      localStorage.setItem('fitroenie_device_id', id)
      return id
    })())
    function log(msg) {
      console.log(msg)
      const el = document.getElementById('debug-log')
      if (el) el.innerHTML += `${msg}<br>`
    }
    function toggleDebug() {
      const el = document.getElementById('debug-log')
      if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block'
    }
    const params = new URLSearchParams(window.location.search)
    if (params.has('pin')) document.getElementById('pin').value = params.get('pin')
    socket.on('connect', () => {
      const cs = document.getElementById('connection-status')
      if (cs) { cs.innerText = '🟢 Verbonden!'; cs.style.color = '#4CAF50' }
      log(`Verbonden: ${socket.id}`)
    })
    socket.on('connect_error', () => {
      const cs = document.getElementById('connection-status')
      if (cs) { cs.innerText = '🔴 Verbindingsfout. Zit je op Wifi?'; cs.style.color = '#ff4d4d' }
      log('Verbindingsfout')
    })
    socket.on('disconnect', () => { log('Verbinding verbroken') })
    function joinGame() {
      const nickname = document.getElementById('nickname').value
      const pin = document.getElementById('pin').value
      if (!nickname || !pin) return
      myPin = pin
      log(`Join poging PIN=${pin}`)
      socket.emit('player-join', { pin, nickname, deviceId, origin: window.location.origin })
    }
    socket.on('join-success', () => {
      document.getElementById('display-name').innerText = document.getElementById('nickname').value
      switchView('screen-wait')
      log('Join succesvol')
    })
    socket.on('error-msg', (msg) => { document.getElementById('error-msg').innerText = msg; log(`Server fout: ${msg}`) })
    socket.on('game-started', () => {
      switchView('screen-game')
      if (navigator.vibrate) navigator.vibrate(200)
      log('Game gestart')
    })
    function sendAnswer(ans) { socket.emit('player-answer', { pin: myPin, answer: ans }) }
    // Heartbeat every 10s to maintain presence
    setInterval(() => {
      if (myPin) socket.emit('heartbeat', { pin: myPin, deviceId })
    }, 10000)
    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
      document.getElementById(id).classList.add('active')
    }
  </script>
</body>
</html>
